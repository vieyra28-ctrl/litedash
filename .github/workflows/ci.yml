name: CI
# Solo en pull requests o a mano (Irving, 2026-11-06: GitHub cobra los minutos de Linux; cada push
# ya se compila, se revisa con lint y se prueba en la Mac antes de subirlo).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El id "compilar" es el check que exige la protección de main: no renombrarlo.
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Memoria de Gradle
        run: |
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i '/^org.gradle.jvmargs=/d' ~/.gradle/gradle.properties
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      - name: Compilar, lint y pruebas
        run: ./gradlew assemblePlayDebug assembleGithubRelease :benchmark:assembleBenchmark lint test --console=plain  -Pcatalog=https://github.com/vieyra28-ctrl/litedash/releases/download/catalogo/catalogo-rio.json

      - name: Presupuesto de tamaño
        run: |
          apk=app/build/outputs/apk/github/release/app-github-release.apk
          size=$(stat -c%s "$apk")
          echo "APK github release: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((8 * 1024 * 1024)) ]; then
            echo "::error::El APK pesa $((size / 1024)) KB y el presupuesto es 8 MB"
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: litedash-github-release
          path: app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error

      - name: Reportes de lint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: app/build/reports/lint-results-*.html
